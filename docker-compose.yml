version: '3.8'

services:
  pos-mobile-api:
    build: .
    container_name: pos-mobile-api
    restart: unless-stopped
    ports:
      - "8003:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=pgsql-14
      - DATABASE_URL=postgresql://postgres:db_password@pgsql-14:5432/img-store
      - DEBUG=True
    networks:
      - pgsql-network

networks:
  pgsql-network:
    external: true
    name: pgsql-14-single_default
